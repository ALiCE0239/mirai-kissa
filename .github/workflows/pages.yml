name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          VERSION="${GITHUB_SHA:0:7}"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p _site
          cp index.html admin.html 管理者ページ.html _site/
          cp -r css js data img 管理者 _site/
          touch _site/.nojekyll
          sed -i 's/content="dev"/content="'"${VERSION}"'"/' _site/index.html
          # 全 HTML のアセット ?v=... をビルドSHAへ自動置換（手動バンプ不要のキャッシュバスト）
          find _site -name '*.html' -type f -exec sed -i 's/?v=[0-9A-Za-z._-]*/?v='"${VERSION}"'/g' {} +
          printf '{"version":"%s","builtAt":"%s"}\n' "$VERSION" "$BUILT_AT" > _site/version.json

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          cname: fictionscale.jp
